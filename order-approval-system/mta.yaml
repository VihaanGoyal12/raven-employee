_schema-version: '3.3.0'
ID: order-approval-system
version: 1.0.0
description: "SAP Order Approval Management System — Raven Infotech"

parameters:
  enable-parallel-deployments: true

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm install
        - npx cds build --production
        - npm install --prefix gen/srv --omit=dev
        - npm install --prefix gen/db

modules:

  # ─── CAP Node.js Backend ─────────────────────────────────────────────────────
  - name: order-approval-srv
    type: nodejs
    path: gen/srv
    parameters:
      buildpack: nodejs_buildpack
      memory: 256M
      disk-quota: 512M
    requires:
      - name: order-approval-db
      - name: order-approval-xsuaa
      - name: order-approval-destination-service
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    build-parameters:
      builder: npm-ci
      ignore:
        - node_modules/

  # ─── HANA HDI Deployer ───────────────────────────────────────────────────────
  - name: order-approval-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
      memory: 256M
    requires:
      - name: order-approval-db
    build-parameters:
      ignore:
        - node_modules/

  # ─── Approuter ───────────────────────────────────────────────────────────────
  - name: order-approval-router
    type: approuter.nodejs
    path: router
    parameters:
      keep-existing-routes: true
      disk-quota: 256M
      memory: 128M
    requires:
      - name: order-approval-xsuaa
      - name: order-approval-destination-service
      - name: order-approval-html5-service
        group: destinations
        properties:
          forwardAuthToken: false
          name: ui5
          url: https://ui5.sap.com
    build-parameters:
      builder: npm

  # ─── UI5 App Zip ─────────────────────────────────────────────────────────────
  - name: orderapprovalsalesorders
    type: html5
    path: app/salesorders
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm install
        - mkdir -p dist && cp -r webapp/* dist/
      supported-platforms: []

  # ─── HTML5 Content Deployer ──────────────────────────────────────────────────
  - name: order-approval-app-content
    type: com.sap.application.content
    path: .
    requires:
      - name: order-approval-html5-service
        parameters:
          content-target: true
    build-parameters:
      build-result: resources
      requires:
        - artifacts:
            - orderapprovalsalesorders.zip
          name: orderapprovalsalesorders
          target-path: resources/

  # ─── Destination Content ─────────────────────────────────────────────────────
  - name: order-approval-destination-content
    type: com.sap.application.content
    requires:
      - name: order-approval-destination-service
        parameters:
          content-target: true
      - name: order-approval-html5-service
        parameters:
          service-key:
            name: order-approval-html5-service-key
      - name: order-approval-xsuaa
        parameters:
          service-key:
            name: order-approval-xsuaa-key
      - name: srv-api
    parameters:
      content:
        instance:
          destinations:
            - Name: order-approval-html5-repo-host
              ServiceInstanceName: order-approval-html5-service
              ServiceKeyName: order-approval-html5-service-key
              sap.cloud.service: order.approval
            - Name: order-approval-xsuaa
              Authentication: OAuth2UserTokenExchange
              ServiceInstanceName: order-approval-xsuaa
              ServiceKeyName: order-approval-xsuaa-key
              sap.cloud.service: order.approval
            - Name: srv-api
              Authentication: OAuth2UserTokenExchange
              ServiceInstanceName: order-approval-xsuaa
              ServiceKeyName: order-approval-xsuaa-key
              URL: ~{srv-api/srv-url}
              sap.cloud.service: order.approval
          existing_destinations_policy: update
    build-parameters:
      no-source: true

resources:

  # ─── HANA HDI Container (isolated, NOT Raven's) ──────────────────────────────
  - name: order-approval-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
    properties:
      hdi-container-name: ${service-name}

  # ─── XSUAA ───────────────────────────────────────────────────────────────────
  - name: order-approval-xsuaa
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      service-name: order-approval-xsuaa
      path: ./xs-security.json
      config:
        xsappname: order-approval-system-${space}
        tenant-mode: dedicated

  # ─── HTML5 App Host ──────────────────────────────────────────────────────────
  - name: order-approval-html5-service
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-name: order-approval-html5-service
      service-plan: app-host

  # ─── Destination Service ─────────────────────────────────────────────────────
  - name: order-approval-destination-service
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite
      service-name: order-approval-destination-service
      config:
        HTML5Runtime_enabled: true
        init_data:
          instance:
            destinations:
              - Name: ui5
                URL: https://ui5.sap.com
                Type: HTTP
                ProxyType: Internet
                Authentication: NoAuthentication
            existing_destinations_policy: update
        version: 1.0.0
